[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svhn-digit-recognition"
version = "0.1.0"
description = "Reproducible SVHN digit recognition experiments with dense and convolutional networks"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "h5py>=3.10,<4", "scikit-learn>=1.3,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
train = ["tensorflow>=2.16,<3"]

[project.scripts]
svhn-recognition = "svhn_recognition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

